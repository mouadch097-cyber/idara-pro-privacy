<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعادة تعيين كلمة المرور - Idara Pro</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #4F46E5 0%, #6366F1 40%, #3B82F6 100%);
    position: relative;
    overflow-x: hidden;
  }

  /* Animated background shapes */
  body::before,
  body::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    animation: float 20s ease-in-out infinite;
  }
  body::before {
    width: 500px;
    height: 500px;
    top: -200px;
    right: -150px;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 70%);
  }
  body::after {
    width: 400px;
    height: 400px;
    bottom: -150px;
    left: -100px;
    background: radial-gradient(circle, rgba(59,130,246,0.3) 0%, rgba(59,130,246,0) 70%);
    animation-delay: -10s;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -30px) scale(1.1); }
  }

  .container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    z-index: 1;
  }

  .card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 48px 36px;
    max-width: 440px;
    width: 100%;
    box-shadow: 
      0 30px 80px rgba(0, 0, 0, 0.25),
      0 0 0 1px rgba(255, 255, 255, 0.5) inset;
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #4F46E5, #3B82F6, #6366F1);
    background-size: 200% 100%;
    animation: shimmer 3s ease infinite;
  }

  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(30px) scale(0.95);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .logo-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }

  .logo {
    width: 88px;
    height: 88px;
    border-radius: 24px;
    background: linear-gradient(135deg, #4F46E5, #3B82F6);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 
      0 12px 30px rgba(79, 70, 229, 0.4),
      0 0 0 4px rgba(255, 255, 255, 0.9),
      0 0 0 8px rgba(79, 70, 229, 0.1);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 12px 30px rgba(79, 70, 229, 0.4), 0 0 0 4px rgba(255, 255, 255, 0.9), 0 0 0 8px rgba(79, 70, 229, 0.1); }
    50% { box-shadow: 0 12px 40px rgba(79, 70, 229, 0.5), 0 0 0 4px rgba(255, 255, 255, 0.9), 0 0 0 12px rgba(79, 70, 229, 0.15); }
  }

  .logo svg {
    width: 48px;
    height: 48px;
    fill: white;
  }

  h1 {
    color: #111827;
    font-size: 26px;
    text-align: center;
    margin-bottom: 8px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .subtitle {
    color: #6B7280;
    font-size: 14px;
    text-align: center;
    margin-bottom: 32px;
    font-weight: 500;
  }

  .brand-name {
    color: #4F46E5;
    font-weight: 700;
  }

  .field {
    margin-bottom: 20px;
    position: relative;
  }

  label {
    display: block;
    color: #374151;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
    padding-right: 4px;
  }

  .input-wrapper {
    position: relative;
  }

  input {
    width: 100%;
    padding: 15px 50px 15px 18px;
    font-size: 15px;
    font-family: 'Cairo', sans-serif;
    font-weight: 500;
    border: 1.5px solid #E5E7EB;
    border-radius: 14px;
    background: #F9FAFB;
    margin: 0;
    transition: all 0.25s ease;
    direction: rtl;
    color: #111827;
  }

  input::placeholder {
    color: #9CA3AF;
    font-weight: 400;
  }

  input:focus {
    outline: none;
    border-color: #4F46E5;
    background: white;
    box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
  }

  .input-icon {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    color: #9CA3AF;
    pointer-events: none;
    transition: color 0.25s;
  }

  input:focus ~ .input-icon {
    color: #4F46E5;
  }

  .btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #4F46E5, #3B82F6);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Cairo', sans-serif;
    cursor: pointer;
    transition: all 0.25s ease;
    margin-top: 8px;
    box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s;
  }

  .btn:hover::before {
    width: 300px;
    height: 300px;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(79, 70, 229, 0.45);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2.5px solid rgba(255, 255, 255, 0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-left: 8px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .message {
    padding: 16px 20px;
    border-radius: 14px;
    margin-top: 20px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    line-height: 1.6;
    display: none;
    animation: slideUp 0.4s ease;
  }

  .success {
    background: linear-gradient(135deg, #D1FAE5, #A7F3D0);
    color: #065F46;
    display: block;
    border: 1px solid #10B981;
  }

  .error {
    background: linear-gradient(135deg, #FEE2E2, #FECACA);
    color: #991B1B;
    display: block;
    border: 1px solid #EF4444;
  }

  .info {
    background: linear-gradient(135deg, #DBEAFE, #BFDBFE);
    color: #1E40AF;
    display: block;
    border: 1px solid #3B82F6;
  }

  .hidden { display: none !important; }

  .loading-container {
    text-align: center;
    padding: 20px 0;
  }

  .loading-spinner {
    width: 48px;
    height: 48px;
    border: 4px solid #E5E7EB;
    border-top-color: #4F46E5;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  .success-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #10B981, #059669);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 30px rgba(16, 185, 129, 0.4);
    animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }

  @keyframes bounceIn {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  .success-icon svg {
    width: 44px;
    height: 44px;
    stroke: white;
    stroke-width: 3;
    fill: none;
  }

  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 12px;
    color: #9CA3AF;
    font-weight: 500;
  }

  .password-strength {
    height: 4px;
    border-radius: 2px;
    background: #E5E7EB;
    margin-top: 8px;
    overflow: hidden;
    transition: all 0.3s;
  }

  .password-strength-bar {
    height: 100%;
    width: 0;
    transition: all 0.3s ease;
    border-radius: 2px;
  }

  .strength-weak { background: #EF4444; width: 33%; }
  .strength-medium { background: #F59E0B; width: 66%; }
  .strength-strong { background: #10B981; width: 100%; }

  @media (max-width: 480px) {
    .card {
      padding: 36px 24px;
      border-radius: 24px;
    }
    h1 { font-size: 22px; }
    .logo { width: 72px; height: 72px; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo-wrapper">
        <div class="logo">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
          </svg>
        </div>
      </div>

      <h1>إعادة تعيين كلمة المرور</h1>
      <p class="subtitle">لحسابك في <span class="brand-name">Idara Pro</span></p>

      <!-- Loading -->
      <div id="loadingState" class="loading-container">
        <div class="loading-spinner"></div>
        <p style="color:#6B7280; font-size: 14px;">جاري التحقق من الرابط...</p>
      </div>

      <!-- Form -->
      <div id="formState" class="hidden">
        <form id="resetForm">
          <div class="field">
            <label for="password">كلمة المرور الجديدة</label>
            <div class="input-wrapper">
              <input type="password" id="password" placeholder="أدخل 6 أحرف على الأقل" minlength="6" required>
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
            <div class="password-strength">
              <div class="password-strength-bar" id="strengthBar"></div>
            </div>
          </div>

          <div class="field">
            <label for="confirmPassword">تأكيد كلمة المرور</label>
            <div class="input-wrapper">
              <input type="password" id="confirmPassword" placeholder="أعد إدخال كلمة المرور" minlength="6" required>
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
          </div>

          <button type="submit" class="btn" id="submitBtn">
            <span id="btnText">حفظ كلمة المرور</span>
            <span id="btnSpinner" class="hidden"><span class="spinner"></span></span>
          </button>
        </form>
      </div>

      <!-- Success -->
      <div id="successState" class="hidden">
        <div class="success-icon">
          <svg viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div class="message success">
          تم تغيير كلمة المرور بنجاح!
          <br>
          يمكنك الآن العودة إلى التطبيق وتسجيل الدخول.
        </div>
      </div>

      <!-- Error -->
      <div id="errorState" class="hidden">
        <div class="message error" id="errorMessage">
          حدث خطأ. الرابط قد يكون منتهي الصلاحية.
        </div>
      </div>

      <p class="footer">© 2026 Idara Pro - إدارة برو</p>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCC8E2xzteCJ09NzwVGX5rCkbO8udVt6mw",
      authDomain: "idara-pro-1f553.firebaseapp.com",
      projectId: "idara-pro-1f553",
      storageBucket: "idara-pro-1f553.firebasestorage.app",
      messagingSenderId: "183130581272",
      appId: "1:183130581272:android:0c686a09e5bf49fa04966d"
    };

    firebase.initializeApp(firebaseConfig);

    const params = new URLSearchParams(window.location.search);
    const oobCode = params.get('oobCode');

    const loadingState = document.getElementById('loadingState');
    const formState = document.getElementById('formState');
    const successState = document.getElementById('successState');
    const errorState = document.getElementById('errorState');
    const errorMessage = document.getElementById('errorMessage');
    const passwordInput = document.getElementById('password');
    const strengthBar = document.getElementById('strengthBar');

    if (!oobCode) {
      loadingState.classList.add('hidden');
      errorState.classList.remove('hidden');
      errorMessage.textContent = 'رابط غير صالح أو منتهي.';
    } else {
      firebase.auth().verifyPasswordResetCode(oobCode)
        .then((email) => {
          loadingState.classList.add('hidden');
          formState.classList.remove('hidden');
          document.querySelector('.subtitle').innerHTML = 
            'لحساب <span class="brand-name">' + email + '</span>';
        })
        .catch((error) => {
          loadingState.classList.add('hidden');
          errorState.classList.remove('hidden');
          errorMessage.textContent = 'الرابط منتهي الصلاحية أو مستخدم بالفعل.';
        });
    }

    // Password strength indicator
    passwordInput.addEventListener('input', (e) => {
      const val = e.target.value;
      strengthBar.className = 'password-strength-bar';
      if (val.length === 0) return;
      if (val.length < 6) {
        strengthBar.classList.add('strength-weak');
      } else if (val.length < 10) {
        strengthBar.classList.add('strength-medium');
      } else {
        strengthBar.classList.add('strength-strong');
      }
    });

    document.getElementById('resetForm').addEventListener('submit', (e) => {
      e.preventDefault();
      errorState.classList.add('hidden');

      const password = passwordInput.value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        errorState.classList.remove('hidden');
        errorMessage.textContent = 'كلمتا المرور غير متطابقتين.';
        return;
      }

      if (password.length < 6) {
        errorState.classList.remove('hidden');
        errorMessage.textContent = 'كلمة المرور قصيرة جدًا (6 أحرف على الأقل).';
        return;
      }

      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      
      btn.disabled = true;
      btnText.classList.add('hidden');
      btnSpinner.classList.remove('hidden');

      firebase.auth().confirmPasswordReset(oobCode, password)
        .then(() => {
          formState.classList.add('hidden');
          successState.classList.remove('hidden');
        })
        .catch((error) => {
          btn.disabled = false;
          btnText.classList.remove('hidden');
          btnSpinner.classList.add('hidden');
          errorState.classList.remove('hidden');
          errorMessage.textContent = 'خطأ: ' + error.message;
        });
    });
  </script>
</body>
</html>
